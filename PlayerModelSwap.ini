; DSCS Player Model Swap - copy to <game>\resources\PlayerModelSwap.ini
[PlayerModelSwap]
; Digimon model code to use for the protagonist (chr + 3 digits, see the README list).
; Empty = vanilla protagonist. chr320 ships full field idle/walk/run motions.
Model=chr320
Enabled=1
; Use battle idle/run motions when the Digimon has no field motions (most of them).
RemapFieldMotions=1
; Virtual-key code that toggles back to the human model until pressed again
; (takes effect on the next map load). Decimal virtual-key code: 119 = F8, 0 = disabled.
TemporaryHumanKey=119
